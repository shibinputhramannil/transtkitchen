# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is first applied. Paths are relative to the repo root.

databases:
  - name: kitchenmind-db
    databaseName: kitchenmind
    user: kitchenmind
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: kitchenmind-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitchenmind-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # The frontend's URL, e.g. https://kitchenmind-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: kitchenmind-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's URL, e.g. https://kitchenmind-api.onrender.com
      - key: VITE_API_URL
        sync: false
