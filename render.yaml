# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is first applied. Paths are relative to the repo root.
# See "Deploy to Render" in README.md for the full runbook.
#
# Region: the API and database are in Singapore (closest to kitchens on India
# time) and must stay together for the private connection string. Render does
# not let a region change after creation. Static sites take no region: they
# are served from Render's global CDN.
#
# Node: the static site's build uses the version in /.node-version.

databases:
  - name: kitchenmind-db
    databaseName: kitchenmind
    user: kitchenmind
    # After upgrading in the dashboard (README: "Upgrading the database"), set
    # `plan` and `diskSizeGB` here to exactly what the dashboard shows BEFORE
    # any Blueprint sync: a sync overwrites dashboard changes, so a stale
    # `free` here could try to move the database back to the free plan.
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    # No ipAllowList on purpose: without it, a sync keeps the inbound rules set
    # in the dashboard. This repository is public, so addresses never go here.

services:
  - type: web
    name: kitchenmind-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kitchenmind-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # The frontend's URL, e.g. https://kitchenmind-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: kitchenmind-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - frontend/**
        - .node-version
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Report-only first: violations appear in the browser console without
      # blocking anything. Once the deployed app shows none, rename this header
      # to Content-Security-Policy to enforce it (see README). connect-src must
      # name the API's real origin; update it if Render gave the API a
      # different hostname.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://kitchenmind-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri https://kitchenmind-api.onrender.com/api/csp-reports/; report-to csp-endpoint"
      - path: /*
        name: Reporting-Endpoints
        value: 'csp-endpoint="https://kitchenmind-api.onrender.com/api/csp-reports/"'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    envVars:
      # The API's URL, e.g. https://kitchenmind-api.onrender.com
      - key: VITE_API_URL
        sync: false
